<link rel="stylesheet" href="/web/app.css">
<style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--wash)}
.login-panel{width:100%;display:grid;place-items:center}
.login-inner{width:min(380px,100%);text-align:center}
.login-logo{display:inline-block;margin-bottom:52px}
.login-logo svg{display:block;width:auto;height:27px}
.login-content{display:flex;flex-direction:column;gap:24px}
.login-content h1{margin:0;color:var(--ink);font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.035em}
.login-lede{margin:11px auto 0;max-width:34ch;color:var(--ink-3);font-size:14px;line-height:1.6}
.google-login{width:100%;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 18px;color:#060b70;background:#fff;border:1px solid rgba(6,11,112,.14);border-radius:var(--r);font:inherit;font-size:14px;font-weight:600;letter-spacing:-.01em;cursor:pointer;text-decoration:none;box-shadow:0 10px 30px -24px rgba(6,11,112,.55);transition:transform .12s var(--out),border-color .14s ease,box-shadow .14s ease}
.google-login:hover{border-color:rgba(6,11,112,.28);box-shadow:0 14px 32px -22px rgba(6,11,112,.5)}
.google-login:active{transform:translateY(1px)}
.google-login svg{flex:none}
.login-error{padding:11px 13px;color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--paper));border:1px solid color-mix(in srgb,var(--bad) 20%,transparent);border-radius:8px;font-size:var(--t-small);line-height:1.5}
.login-note{padding:11px 13px;color:var(--ink-2);background:var(--wash-2);border:1px solid var(--rule);border-radius:8px;font-size:var(--t-small);line-height:1.5}
.login-trust{margin:-8px 0 0;color:var(--ink-4);font-size:var(--t-small);line-height:1.6}
@media (max-width:640px){.login-shell{padding:20px}.login-logo{margin-bottom:42px}.login-content h1{font-size:25px}}
</style>
</head>
<body>
<main class="login-shell"><section class="login-panel"><div class="login-inner">
